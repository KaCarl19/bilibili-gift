{% extends "base.html" %}
{% block body %}
<div class="wrap">
  <form class="card" method="post" action="/request">
    <h1>修改收货信息</h1>
    {% if msg %}<div class="box warn" style="margin-top:12px">{{ msg }}</div>{% endif %}
    {% for e in errors %}<div class="err">{{ e }}</div>{% endfor %}
    <input type="hidden" name="ticket" value="{{ ticket }}">
    <label for="receiver">收件人姓名</label>
    <input id="receiver" name="receiver" maxlength="20" required value="{{ addr.receiver or '' }}">
    <label for="phone">手机号</label>
    <input id="phone" name="phone" inputmode="numeric" maxlength="13" required value="{{ addr.phone or '' }}">
    <label for="address">收货地址</label>
    <textarea id="address" name="address" maxlength="200" required placeholder="省 / 市 / 区 + 街道门牌号">{{ addr.address or '' }}</textarea>
    <button class="full" type="submit">提交修改申请</button>
    <p class="help">提示：以后用<b>同一台手机</b>修改就不需要再等主播确认了。</p>
  </form>
</div>
{% endblock %}
