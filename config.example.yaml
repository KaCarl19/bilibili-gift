# ============ 舰长礼物小助手 配置文件 ============
# 推荐直接在图形界面「设置」里修改；也可以用记事本改（冒号后面要有空格）

streamer:
  name: "你的B站昵称"                # 主播 B站昵称
  room_id: 123456              # 直播间号
  # 截图里出现以下任意一个词，才算“你直播间”的截图（一般填昵称、粉丝牌名）
  keywords: ["你的B站昵称", "粉丝牌名"]

bilibili:
  check_api: true            # 调用 B站 公开接口核对舰长名单（推荐开启）

qq:
  groups: [123456789]              # 舰长群群号
  admins: [10001]              # 主播/管理员 QQ（接收待审核提醒）
  kick_unverified_minutes: 0   # 新人多少分钟内不验证就踢出，0 = 不踢
  access_token: ""          # 与 NapCat 里填的 token 一致（可留空）

web:
  port: 8765                   # 程序使用的端口
  public_url: "http://127.0.0.1:8765"   # 观众打开填写链接用的地址
  admin_password: "请改成一个复杂的密码"   # 网页后台密码
  link_valid_hours: 24           # 填写链接有效小时数

rules:
  edit_grace_days: 0            # 每月前几天仍允许上月舰长修改地址，0 = 只允许当月

napcat:
  path: ""                  # NapCat 启动程序位置（可选，用于一键启动）

gui:
  autostart: true            # 打开软件时自动启动机器人
